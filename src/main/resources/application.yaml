server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: flow-manager-route
          uri: lb://flow-manager
          predicates:
            - Path=/api/v1/files/**

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: api-gateway
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/file-converter

      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/file-converter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/