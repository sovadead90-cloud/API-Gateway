server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: flow-manager-route
          uri: lb://flow-manager
          predicates:
            - Path=/api/v1/files/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
